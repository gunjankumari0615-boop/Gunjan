<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Todo List</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #141E30;
            background: linear-gradient(135deg, #141E30, #243B55);
        }


        .container {

            width: 420px;
            background: #1f2937;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            color: white;

        }


        h2 {

            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
            color: #38bdf8;

        }



        .input-box {

            display: flex;
            gap: 10px;

        }



        input {

            flex: 1;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 12px;
            background: #374151;
            color: white;
            font-size: 16px;

        }


        input::placeholder {

            color: #cbd5e1;

        }



        button {

            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            background: #38bdf8;
            color: #111827;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;

        }


        button:hover {

            background: #0ea5e9;
            transform: scale(1.05);

        }



        ul {

            list-style: none;
            margin-top: 25px;

        }



        li {

            background: #374151;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            transition: .3s;

        }


        li:hover {

            transform: translateX(5px);
            background: #475569;

        }



        li.completed {

            text-decoration: line-through;
            opacity: .5;

        }



        .delete {

            background: #ef4444;
            color: white;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 14px;

        }


        .delete:hover {

            background: #dc2626;

        }
    </style>

</head>

<body>

    <div class="container">

        <h2>📝 Todo List</h2>

        <div class="input-box">
            <input type="text" id="task" placeholder="Enter your task">
            <button id="add">Add</button>
        </div>

        <ul id="list"></ul>

    </div>


    <script>

        $(document).ready(function () {

            // Add task
            $("#add").click(function () {

                let task = $("#task").val();

                if (task != "") {

                    $("#list").append(`
                <li>
                    <span>${task}</span>
                    <button class="delete">Delete</button>
                </li>
            `);

                    $("#task").val("");

                }
                else {
                    alert("Please enter a task");
                }

            });


            // Complete task
            $(document).on("click", "li span", function () {

                $(this).parent().toggleClass("completed");

            });


            // Delete task
            $(document).on("click", ".delete", function () {

                $(this).parent().remove();

            });


        });

    </script>

</body>

</html>
